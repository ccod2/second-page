<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>나라키우기 v0.0.1</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#1b262c;color:#eceff1;font-family:system-ui,-apple-system,"Noto Sans KR","Malgun Gothic",sans-serif;touch-action:manipulation;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;height:100vh;height:100dvh}
.screen{position:absolute;inset:0;display:none;overflow:auto;-webkit-overflow-scrolling:touch}
.screen.active{display:flex}
.screen.center .box{margin:auto;width:100%;max-width:420px;padding:20px 20px calc(20px + env(safe-area-inset-bottom))}
h1{font-size:2rem;margin:0 0 24px;text-align:center}
h2{font-size:1.4rem;margin:0 0 16px;text-align:center}
label{display:block;margin:12px 0 6px;font-size:.95rem;color:#b0bec5}
input{width:100%;font-size:1.1rem;padding:12px;border-radius:10px;border:2px solid #455a64;background:#263238;color:#eceff1;-webkit-user-select:text;user-select:text}
input:focus{outline:none;border-color:#4fc3f7}
button{font:inherit;font-size:1.1rem;font-weight:600;min-height:48px;padding:10px 16px;border:0;border-radius:10px;background:#4fc3f7;color:#102027;cursor:pointer}
button.sub{background:#37474f;color:#eceff1}
button:disabled{background:#37474f;color:#78909c;cursor:default}
.box button{display:block;width:100%;margin-top:12px}
.msg{min-height:1.4em;margin:12px 0 0;color:#ff8a80;text-align:center;overflow-wrap:anywhere}
.hint{margin:12px 0 0;color:#b0bec5;text-align:center;overflow-wrap:anywhere}
.code{font-size:2.6rem;font-weight:700;letter-spacing:.25em;text-align:center;margin:4px 0 16px;padding-left:.25em}
.plist{list-style:none;margin:8px 0 0;padding:0}
.plist li{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-top:8px;background:#263238;border-radius:10px;overflow-wrap:anywhere}
.chip{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid #eceff1}
#screen-game{flex-direction:column;overflow:hidden}
#topbar{flex:none;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top));background:#263238;border-bottom:1px solid #455a64}
#turnline{font-size:1.1rem;font-weight:700;display:flex;flex-wrap:wrap;align-items:center;gap:8px;overflow-wrap:anywhere}
#orderline{margin-top:4px;font-size:.9rem;color:#b0bec5;display:flex;flex-wrap:wrap;gap:4px 10px}
#orderline .cur{color:#fff;font-weight:700}
#mapwrap{flex:1;min-height:0;position:relative}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#sheet{position:absolute;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;max-height:55%;overflow:auto;display:none;background:#263238;border-top:2px solid #4fc3f7;border-radius:14px 14px 0 0;padding:14px 16px calc(14px + env(safe-area-inset-bottom))}
#sheet.open{display:block}
#sheet .row{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
#landname{font-size:1.4rem;font-weight:700;overflow-wrap:anywhere}
#owner{margin-top:6px;display:flex;align-items:center;gap:8px;overflow-wrap:anywhere}
#sheet .close{flex:none;min-height:40px;padding:6px 12px}
#startbtn{display:block;width:100%;margin-top:12px}
#orderline:empty{display:none}
#troops{margin-top:6px}
#sendbtn{display:block;width:100%;margin-top:12px}
.sendbtns{display:flex;gap:8px;margin-top:12px}
#btn-draw{flex:2 1 0}
#btn-sendback{flex:1 1 0}
@media (min-height:481px){#sheet.sending{max-height:80%}}
#sendpanel{display:none}
.sendrow{display:flex;gap:10px}
.sendrow input{flex:1;min-width:0}
.sendrow button{flex:none}
#sendhint{margin:8px 0 0;text-align:left}
#toast{position:absolute;top:8px;left:50%;transform:translateX(-50%);max-width:92%;display:none;padding:10px 14px;background:rgba(16,32,39,.95);border:1px solid #ff8a80;border-radius:10px;color:#ffccbc;text-align:center;overflow-wrap:anywhere;z-index:5;pointer-events:none}
#drawbar{position:absolute;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;max-height:55%;overflow:auto;display:none;background:#263238;border-top:2px solid #4fc3f7;border-radius:14px 14px 0 0;padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
#drawbar.open{display:block}
#drawinfo{overflow-wrap:anywhere}
#drawbar .btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
#drawbar .btns button{flex:1 1 auto;min-height:44px;font-size:1rem}
@media (max-height:480px){ /* 가로 화면: 정보창과 길 그리기 막대를 오른쪽에 세워 지도를 덜 가림 */
#sheet,#drawbar{left:auto;right:0;top:0;bottom:0;width:min(320px,50%);max-width:none;max-height:none;margin:0;border-top:0;border-left:2px solid #4fc3f7;border-radius:14px 0 0 14px}
#sheet{padding:8px 12px}
#sheet #troops,#sheet #owner{margin-top:2px}
#sendbtn,.sendbtns{margin-top:6px}
#sendhint{margin:2px 0}
}
#overlay-disc,#overlay-msg{position:absolute;inset:0;display:none;overflow:auto;background:rgba(16,32,39,.96);z-index:10}
#overlay-msg{z-index:9}
#overlay-disc.active,#overlay-msg.active{display:flex}
</style>
</head>
<body>
<div id="app">
  <div id="screen-start" class="screen center active"><div class="box">
    <h1>나라키우기</h1>
    <button id="btn-go-create">방 만들기</button>
    <button id="btn-go-join" class="sub">방 들어가기</button>
  </div></div>

  <div id="screen-create" class="screen center"><div class="box">
    <h2>방 만들기</h2>
    <label for="in-name-c">이름</label>
    <input id="in-name-c" type="text" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button id="btn-create">방 만들기</button>
    <button id="btn-back-c" class="sub">뒤로</button>
    <p id="msg-create" class="msg"></p>
  </div></div>

  <div id="screen-join" class="screen center"><div class="box">
    <h2>방 들어가기</h2>
    <label for="in-name-j">이름</label>
    <input id="in-name-j" type="text" autocomplete="off" autocapitalize="off" spellcheck="false">
    <label for="in-code">방 코드</label>
    <input id="in-code" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false">
    <button id="btn-join">들어가기</button>
    <button id="btn-back-j" class="sub">뒤로</button>
    <p id="msg-join" class="msg"></p>
  </div></div>

  <div id="screen-lobby" class="screen center"><div class="box">
    <h2>방 코드</h2>
    <div id="roomcode" class="code"></div>
    <div id="lobbycount"></div>
    <ul id="lobbylist" class="plist"></ul>
    <button id="btn-start">시작</button>
    <p id="lobbyhint" class="hint"></p>
  </div></div>

  <div id="screen-game" class="screen">
    <div id="topbar"><div id="turnline"></div><div id="orderline"></div></div>
    <div id="mapwrap">
      <canvas id="map"></canvas>
      <div id="toast"></div>
      <div id="sheet">
        <div class="row"><div id="landname"></div><button id="btn-close" class="sub close">닫기</button></div>
        <div id="owner"></div>
        <div id="troops"></div>
        <button id="startbtn">여기서 시작</button>
        <button id="sendbtn">병력 보내기</button>
        <div id="sendpanel">
          <label for="in-send">보낼 병력</label>
          <div class="sendrow"><input id="in-send" type="number" inputmode="numeric" min="1" step="1" placeholder="인원"><button id="btn-all" class="sub">전부</button></div>
          <p id="sendhint" class="hint"></p>
          <div class="sendbtns"><button id="btn-draw">길 그리기</button><button id="btn-sendback" class="sub">뒤로</button></div>
        </div>
      </div>
      <div id="drawbar">
        <div id="drawinfo"></div>
        <div class="btns"><button id="btn-undo" class="sub">마지막 점 지우기</button><button id="btn-cancel" class="sub">취소</button><button id="btn-go">출발</button></div>
      </div>
    </div>
  </div>

  <div id="overlay-msg"><div class="box" style="margin:auto;width:100%;max-width:420px;padding:20px">
    <h2 id="msgtitle"></h2>
    <p id="msgtext" class="hint"></p>
    <button id="btn-msg-ok" style="display:block;width:100%;margin-top:16px">확인</button>
  </div></div>

  <div id="overlay-disc"><div class="box" style="margin:auto;width:100%;max-width:420px;padding:20px">
    <h2>연결이 끊겼습니다</h2>
    <p class="hint">게임을 처음부터 다시 시작해 주세요.</p>
    <button id="btn-restart" style="display:block;width:100%;margin-top:16px">처음으로</button>
  </div></div>
</div>

<script>

const TERRAIN = []; // { kind, name, pieces: [[점...]...], passages: [[x, y]...] } — 통로 자리는 선이 끊겨 있음

  const msg = $('msg-create'); msg.textContent = ''; $('btn-create').disabled = true;

    const pc = PLAYER_COLORS[playerById(state, a.owner).color], t = String(a.n), R = ARMY_MARK_PX, w = Math.max(2 * R, ctx.measureText(t).width + 10);
    ctx.beginPath(); ctx.moveTo(x - w / 2 + R, y - R); ctx.lineTo(x + w / 2 - R, y - R); ctx.arc(x + w / 2 - R, y, R, -Math.PI / 2, Math.PI / 2);
    ctx.lineTo(x - w / 2 + R, y + R); ctx.arc(x - w / 2 + R, y, R, Math.PI / 2, Math.PI * 1.5); ctx.closePath();
    ctx.fillStyle = pc.hex; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#ffffff'; ctx.stroke();
    ctx.fillStyle = pc.text; ctx.fillText(t, x, y + 1);
  }
  ctx.lineWidth = LAND_STROKE_PX;
}

// --- 누른 땅 찾기 ---
function pointInRing(p, x, y) {
  let inside = false;
  for (let i = 0, j = p.length - 2; i < p.length; j = i, i += 2) {
    const xi = p[i], yi = p[i + 1], xj = p[j], yj = p[j + 1];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
function landAtWorld(wx, wy) { // 지도 좌표가 어느 땅 안인지 (바다면 null)
  for (const land of LANDS) {
    if (wx < land.minX || wx > land.maxX || wy < land.minY || wy > land.maxY) continue;
    let inside = false;
    for (const r of land.rings) {
      if (wx < r.minX || wx > r.maxX || wy < r.minY || wy > r.maxY) continue;
      if (pointInRing(r.pts, wx, wy)) inside = !inside;
    }
    if (inside) return land;
  }
  return null;
}
function landAt(sx, sy) {
  const sc = scaleNow(), w = toWorld(sx, sy);
  const exact = landAtWorld(w.x, w.y); // 정확히 땅 안을 누른 경우
  if (exact) return exact;
  let best = null, bd = Infinity; // 너무 작아 점으로 보이는 땅은 점 근처를 눌러도 인정
  for (const land of LANDS) {
    if (!isTiny(land, sc)) continue;
    const x = (land.minX + land.maxX) / 2, y = (land.minY + land.maxY) / 2;
    const d = Math.hypot(x - w.x, y - w.y) * sc;
    if (d <= TINY_HIT_PAD_PX && d < bd) { best = land; bd = d; }
  }
  return best;
}
function addDot(sx, sy) { // 길 그리기 중 누른 곳에 점 찍기 (갈 수 없는 곳이면 안내만)
  const w = toWorld(sx, sy);
  if (draw.pts.length > PATH_MAX_POINTS) { toast('점은 최대 ' + PATH_MAX_POINTS + '개까지 찍을 수 있습니다.'); return; }
  const why = pathProblem([draw.pts[draw.pts.length - 1], [w.x, w.y]]);
  if (why) { toast(why); return; }
  draw.pts.push([w.x, w.y]); renderDrawbar(); drawMap();
}
function onMapTap(sx, sy) {
  if (draw) { addDot(sx, sy); return; }
  const land = landAt(sx, sy), id = land ? land.id : null;
  if (id !== selectedId) sheetMode = 'info';
  selectedId = id;
  renderSheet(); drawMap();
}

// --- 손가락 조작: 한 손가락 끌기 = 이동, 두 손가락 = 확대·축소, 거의 안 움직이고 떼면 = 누름 ---
const ptrs = new Map();
let g = null; // 현재 동작 정보
function localPos(e) { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
function startTwo() {
  const [a, b] = [...ptrs.values()];
  const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
  g.two = { dist: Math.max(1, Math.hypot(a.x - b.x, a.y - b.y)), zoom: view.zoom, anchor: toWorld(mid.x, mid.y) };
}
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, localPos(e));
  if (ptrs.size === 1) g = { start: localPos(e), last: localPos(e), moved: false, tap: true, two: null };
  else if (g) { g.tap = false; if (ptrs.size === 2) startTwo(); else g.two = null; }
  e.preventDefault();
});
canvas.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId) || !g) return;
  const p = localPos(e); const prev = ptrs.get(e.pointerId); ptrs.set(e.pointerId, p);
  if (ptrs.size >= 2 && g.two) {
    const [a, b] = [...ptrs.values()];
    const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    view.zoom = g.two.zoom * Math.hypot(a.x - b.x, a.y - b.y) / g.two.dist;
    view.zoom = Math.max(MAP_ZOOM_MIN, Math.min(MAP_ZOOM_MAX, view.zoom));
    const sc = scaleNow();
    view.cx = g.two.anchor.x - (mid.x - view.w / 2) / sc; view.cy = g.two.anchor.y - (mid.y - view.h / 2) / sc;
    clampView(); drawMap(); return;
  }
  if (ptrs.size === 1) {
    if (!g.moved && Math.hypot(p.x - g.start.x, p.y - g.start.y) > TAP_MOVE_MAX_PX) { g.moved = true; g.tap = false; g.last = prev; }
    if (g.moved) {
      const sc = scaleNow(); view.cx -= (p.x - g.last.x) / sc; view.cy -= (p.y - g.last.y) / sc; g.last = p;
      clampView(); drawMap();
    }
  }
});
function endPtr(e, cancelled) {
  if (!ptrs.has(e.pointerId)) return;
  const p = ptrs.get(e.pointerId); ptrs.delete(e.pointerId);
  if (!g) return;
  if (ptrs.size === 0) {
    if (g.tap && !cancelled) onMapTap(p.x, p.y);
    g = null;
  } else {
    g.two = null; g.tap = false; g.moved = true; g.last = [...ptrs.values()][0];
    if (ptrs.size === 2) startTwo();
  }
}
canvas.addEventListener('pointerup', e => endPtr(e, false));
canvas.addEventListener('pointercancel', e => endPtr(e, true));
canvas.addEventListener('contextmenu', e => e.preventDefault());

/* ===================== 버튼 연결 ===================== */
$('btn-go-create').onclick = () => showScreen('create');
$('btn-go-join').onclick = () => showScreen('join');
$('btn-back-c').onclick = $('btn-back-j').onclick = () => {
  if (net.peer) { try { net.peer.destroy(); } catch (e) {} net.peer = null; }
  clearTimeout(net.joinTimer); $('btn-create').disabled = false; $('btn-join').disabled = false;
  $('msg-create').textContent = ''; $('msg-join').textContent = ''; showScreen('start');
};
$('btn-create').onclick = () => {
  const name = cleanName($('in-name-c').value);
  if (!name) { $('msg-create').textContent = '이름을 입력해 주세요.'; return; }
  createRoom(name);
};
$('btn-join').onclick = () => {
  const name = cleanName($('in-name-j').value), code = $('in-code').value.trim().toUpperCase();
  if (!name) { $('msg-join').textContent = '이름을 입력해 주세요.'; return; }
  if (!code) { $('msg-join').textContent = '방 코드를 입력해 주세요.'; return; }
  joinRoom(name, code);
};
$('btn-start').onclick = hostStart;
$('btn-close').onclick = () => { selectedId = null; renderSheet(); drawMap(); };
$('startbtn').onclick = () => { if (selectedId) { $('startbtn').disabled = true; submitPick(selectedId); } };
$('btn-restart').onclick = () => location.reload();
$('btn-msg-ok').onclick = () => $('overlay-msg').classList.remove('active');
// --- 병력 보내기 ---
const poolNow = () => state.g.troops[me];
$('sendbtn').onclick = () => { sheetMode = 'send'; $('in-send').value = ''; $('sendhint').textContent = ''; renderSheet(); };
$('in-send').oninput = () => { // 수도 병력보다 많이는 입력할 수 없음
  let v = parseInt($('in-send').value, 10); if (isNaN(v)) return;
  if (v > poolNow()) { v = poolNow(); $('sendhint').textContent = '수도 병력은 ' + v + '명입니다.'; } else $('sendhint').textContent = '';
  if (v < 1) v = 1;
  $('in-send').value = v;
};
$('btn-all').onclick = () => { $('in-send').value = poolNow(); $('sendhint').textContent = ''; };
$('btn-sendback').onclick = () => { sheetMode = 'info'; renderSheet(); };
$('btn-draw').onclick = () => {
  let n = parseInt($('in-send').value, 10);
  if (!(n >= 1)) { $('sendhint').textContent = '보낼 인원을 입력해 주세요.'; return; }
  n = Math.min(n, poolNow());
  draw = { n, pts: [LAND_BY_ID[state.g.cap[me]].anchor.slice()] };
  selectedId = null; sheetMode = 'info'; renderAll();
};
// --- 길 그리기 ---
$('btn-undo').onclick = () => { if (draw && draw.pts.length > 1) { draw.pts.pop(); renderDrawbar(); drawMap(); } };
$('btn-cancel').onclick = () => { draw = null; renderAll(); };
$('btn-go').onclick = () => {
  if (!draw || draw.pts.length < 2) return;
  const path = draw.pts.map(p => [+p[0].toFixed(5), +p[1].toFixed(5)]), n = draw.n;
  const why = pathProblem(path); if (why) { toast(why); return; }
  draw = null; submitDepart(n, path); renderAll();
};
function submitDepart(n, path) {
  if (net.role === 'host') {
    const err = doDepart(state, me, n, path);
    if (err) toast(err); else { broadcast(); renderAll(); }
  } else if (net.hostConn && net.hostConn.open) net.hostConn.send({ t: 'depart', n, path });
}
</script>
